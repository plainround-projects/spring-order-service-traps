<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="768" viewBox="0 0 1200 768" role="img" aria-labelledby="t d">
<title id="t">An order service with three planted traps</title>
<desc id="d">An Orders API client sends GET and POST requests to the OrderController in interfaces.web, whose named errors go to the OrdersExceptionHandler as problem documents. In the application layer GET goes to OrderQueryService.listOrders in a read-only transaction and POST goes to CheckoutService.checkout, the single transactional entry point. In infrastructure.persistence, JpaOrderRepository runs one fetch join statement, JpaAuditLog is its own bean with REQUIRES_NEW and commits on its own, and JpaStockRepository uses a version column in the same transaction. All three reach PostgreSQL 18. Two amber notes name the traps a code review misses: the N+1 listing and the self-invoked transactional method.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="767" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="766" rx="16"/>
<text class="title" x="48" y="68">An order service with three planted traps</text>
<text class="caption" x="48" y="100">Orders in one transaction, the audit in its own. Amber: the two traps a code review misses.</text>

<rect class="actor" x="48" y="198" width="152" height="84" rx="42"/>
<text class="name" x="124" y="232" text-anchor="middle">Orders API</text>
<text class="sub" x="124" y="256" text-anchor="middle">GET, POST orders</text>

<rect class="boundary" x="256" y="132" width="264" height="324" rx="14"/>
<text class="tag" x="272" y="160">interfaces.web</text>
<rect class="svc" x="272" y="176" width="232" height="128" rx="12"/>
<text class="name" x="288" y="208">OrderController</text>
<text class="sub" x="288" y="232">validates the body</text>
<text class="sub" x="288" y="254">@Valid, 1 to 50 lines</text>
<text class="sub" x="288" y="276">calls the Spring proxy</text>
<rect class="svc" x="272" y="336" width="232" height="96" rx="12"/>
<text class="name" x="288" y="368">Error mapping</text>
<text class="sub" x="288" y="392">OrdersExceptionHandler</text>
<text class="sub" x="288" y="414">problem+json</text>

<rect class="boundary" x="560" y="132" width="264" height="388" rx="14"/>
<text class="tag" x="576" y="160">application</text>
<rect class="svc" x="576" y="176" width="232" height="96" rx="12"/>
<text class="name" x="592" y="208">OrderQueryService</text>
<text class="sub" x="592" y="232">listOrders()</text>
<text class="sub" x="592" y="254">read-only transaction</text>
<rect class="svc" x="576" y="316" width="232" height="174" rx="12"/>
<text class="name" x="592" y="348">CheckoutService</text>
<text class="sub" x="592" y="372">checkout()</text>
<text class="sub" x="592" y="394">@Transactional entry</text>
<text class="sub" x="592" y="416">1 audit 2 place 3 stock</text>

<rect class="boundary" x="864" y="132" width="288" height="400" rx="14"/>
<text class="tag" x="880" y="160">infrastructure.persistence</text>
<rect class="svc" x="880" y="176" width="256" height="96" rx="12"/>
<text class="name" x="896" y="208">JpaOrderRepository</text>
<text class="sub" x="896" y="232">fetch join:</text>
<text class="sub" x="896" y="254">1 statement</text>
<rect class="svc" x="880" y="320" width="256" height="84" rx="12"/>
<text class="name" x="896" y="352">JpaAuditLog</text>
<text class="sub" x="896" y="376">REQUIRES_NEW, own bean</text>
<text class="sub" x="896" y="398">own commit</text>
<rect class="svc" x="880" y="424" width="256" height="84" rx="12"/>
<text class="name" x="896" y="456">JpaStockRepository</text>
<text class="sub" x="896" y="480">@Version</text>
<text class="sub" x="896" y="502">same transaction</text>

<path class="store" d="M904 592a116 12 0 0 1 232 0v76a116 12 0 0 1 -232 0z"/>
<path class="rim" d="M904 592a116 12 0 0 0 232 0"/>
<text class="name" x="1020" y="632" text-anchor="middle">PostgreSQL 18</text>
<text class="sub" x="1020" y="654" text-anchor="middle">Flyway V1 to V3</text>

<rect class="note" x="48" y="330" width="200" height="118" rx="10"/>
<text class="label b t-warn" x="64" y="358">N+1</text>
<text class="sub" x="64" y="382">21 statements for</text>
<text class="sub" x="64" y="404">20 orders; with the</text>
<text class="sub" x="64" y="426">fetch join: 2 max</text>
<rect class="note" x="48" y="470" width="200" height="118" rx="10"/>
<text class="label b t-warn" x="64" y="498">Self-invocation</text>
<text class="sub" x="64" y="522">an own-class call</text>
<text class="sub" x="64" y="544">skips the proxy: no</text>
<text class="sub" x="64" y="566">transaction at all</text>

<path class="sync" d="M200 240H272"/>
<path class="sync" d="M504 220H576"/>
<text class="label t-accent" x="526" y="208">GET</text>
<path class="sync" d="M504 280H534Q546 280 546 292V338Q546 350 558 350H576"/>
<text class="label t-accent" x="526" y="268">POST</text>
<path class="async" d="M388 304V336"/>
<path class="sync" d="M808 224H880"/>
<path class="sync" d="M808 330H828Q840 330 840 318V274Q840 262 852 262H880"/>
<path class="sync" d="M808 362H880"/>
<path class="sync" d="M808 466H880"/>
<path class="sync" d="M1020 532V580"/>
<text class="label t-accent" x="1008" y="562" text-anchor="end">audit commits on its own</text>

<path class="sync" d="M48 724H112"/><text class="legend" x="124" y="729">sync call</text>
<path class="async" d="M264 724H328"/><text class="legend" x="340" y="729">async message</text>
</svg>
